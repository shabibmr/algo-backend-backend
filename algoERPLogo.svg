<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&amp;display=swap');
      .bg { fill: #ffffff; }
      .brand-green { fill: #48C764; }
      .brand-grey { fill: #525252; }
      .text-grey { font-family: 'Comfortaa', 'Varela Round', system-ui, sans-serif; font-weight: 700; fill: #525252; }
      .text-green { font-family: 'Comfortaa', 'Varela Round', system-ui, sans-serif; font-weight: 700; fill: #48C764; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="1000" height="900" />

  <!-- Logo Mark / Icon (algoRay Brand Monogram) -->
  <g transform="translate(420, 240) scale(1.6)">
    <!-- Lowercase 'a' green body -->
    <path class="brand-green" d="
      M 0, -35
      C 30, -35 55, -10 55, 30
      L 55, 80
      C 55, 92 45, 102 32, 102
      C 20, 102 10, 92 10, 80
      L 10, 68
      C -5, 88 -32, 98 -60, 80
      C -92, 60 -95, 8 -68, -25
      C -48, -48 -10, -55 0, -35 Z
      M 10, 25
      C 10, -15 -18, -28 -42, -28
      C -68, -28 -78, 2 -70, 25
      C -62, 50 -35, 60 -10, 56
      C 1, 52 10, 40 10, 25 Z
    " />

    <!-- Top Grey Arc Curve -->
    <path class="brand-grey" d="
      M -2, -50
      C 25, -92 82, -85 125, -48
      C 134, -40 120, -22 108, -32
      C 78, -58 38, -62 16, -34
      C 8, -24 -8, -38 -2, -50 Z
    " />
  </g>

  <!-- Logo Text -->
  <g transform="translate(500, 640)" text-anchor="middle">
    <text font-size="150" letter-spacing="-3">
      <tspan class="text-grey">algo</tspan><tspan class="text-green">ERP</tspan>
    </text>
  </g>
</svg>
